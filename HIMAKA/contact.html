<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="images/logo-himaka.png" type="image/png">
    <title>Contact | HIMAKA FTI UMBY</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav>
            <div class="logo-container">
                <img src="images/logo-himaka.png" alt="Logo" class="logo-img">
                <div class="brand-name">HIMAKA FTI UMBY</div>
            </div>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="profile.html">Profile</a></li>
                <li><a href="struktur.html">Structure</a></li>
                <li><a href="gallery.html">Gallery</a></li>
                <li><a href="contact.html" class="active">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main style="display: flex; justify-content: center;">
        <div class="glass-card" style="max-width: 600px; width: 100%;">
            <h2 style="color: var(--gold); text-align: center;">HUBUNGI KAMI</h2>
            <br>
            <form id="formHimaka">
                <input type="text" id="name" placeholder="Nama Lengkap" required>
                <input type="email" id="email" placeholder="Alamat Email" required>
                <textarea id="message" rows="5" placeholder="Tulis aspirasi atau pertanyaan..." required></textarea>
                <button type="submit" class="btn" style="width: 100%;">KIRIM PESAN</button>
            </form>
        </div>
    </main>

    <footer>
        <img src="images/logo-himaka.png" alt="Logo" style="width: 40px; margin-bottom: 10px; margin-right: 15px;">
        <img src="images/logo-fti.png" alt="Logo" style="width: 40px; margin-bottom: 10px; margin-right: 15px;">
        <img src="images/logo-UMBY.png" alt="Logo" style="width: 40px; margin-bottom: 10px; margin-right: 15px;">
        <p>&copy; 2026 HIMAKA FTI UMBY - Informatics Department | Created by Aziz Zaghlul Ikhsanudin</p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
